[package]
name = "reddtty"
version = "0.2.0-beta.4"
edition = "2024"
description = "A modern, image-capable Reddit reader for the terminal"
license = "MIT"
rust-version = "1.89"
default-run = "reddtty"

[[bin]]
name = "reddtty"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.2.2"
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.9", features = ["derive"] }
async-trait = "0.1.92"
lru = "0.19.1"
dirs = "6.0.0"
url = "2.5.7"
scraper = "0.29.0"
